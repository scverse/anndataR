## Modified from the {biocthis} check action
## > biocthis::use_bioc_github_action()
##
## More info at https://lcolladotor.github.io/biocthis/articles/biocthis.html#use_bioc_github_action

on:
  push:
    branches: [devel]
  pull_request:

name: R-CMD-check-bioc

env:
  run_covr: 'true'
  run_pkgdown: 'true'
  cache-version: 'cache-v1'
  bioc_version: 'bioc-devel'

jobs:
  bioc-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-bioc-matrix.outputs.matrix }}
      linux_cont: ${{ steps.set-bioc-matrix.outputs.linux_cont }}
      linux_r: ${{ steps.set-bioc-matrix.outputs.linux_r }}
      linux_bioc: ${{ steps.set-bioc-matrix.outputs.linux_bioc }}
      linux_os: ${{ steps.set-bioc-matrix.outputs.linux_os }}
    steps:
      - id: set-bioc-matrix
        run: |
          bioc=$(curl -L https://bioconductor.org/config.yaml)

          if [[ "$bioc_version" == "bioc-release" ]]; then
            echo "Finding the latest BioC release version and the corresponding R version"
            biocversion=$(echo "$bioc" | grep "release_version: " | grep -Eo "[0-9]{1}\.[0-9]{2}")
            rversion=$(echo "$bioc" | grep "r_version_associated_with_release: " | grep -Eo "[0-9]{1}\.[0-9]{1}")
            biocmajor=$(echo "$biocversion" | cut -c 1-1)
            biocminor=$(echo "$biocversion" | cut -c 3-4)
            bioccont=$(echo "bioconductor/bioconductor_docker:RELEASE_${biocmajor}_${biocminor}")
          elif [[ "$bioc_version" == "bioc-devel" ]]; then
            echo "Finding the latest BioC devel version and the corresponding R version"
            biocversion=$(echo "$bioc" | grep "devel_version: " | grep -Eo "[0-9]{1}\.[0-9]{2}")
            rversion_release=$(echo "$bioc" | grep "r_version_associated_with_release: " | grep -Eo "[0-9]{1}\.[0-9]{1}")
            rversion_devel=$(echo "$bioc" | grep "r_version_associated_with_devel: " | grep -Eo "[0-9]{1}\.[0-9]{1}")
            if [[ "$rversion_release" == "$rversion_devel" ]]; then
              rversion=$(echo "$rversion_devel")
            else
              rversion="devel"
            fi
            bioccont="bioconductor/bioconductor_docker:devel"
          else
            echo "Finding the the R version for bioc version ${bioc_version}"
            biocversion=$(echo "$bioc_version")
            rversion=$(echo "$bioc" | sed -En "/r_ver_for_bioc_ver/,/release_dates/p" | grep "$bioc_version\":" | grep -Eo ": \"[0-9]{1}\.[0-9]{1}" | grep -Eo "[0-9]{1}\.[0-9]{1}")
            biocmajor=$(echo "$biocversion" | cut -c 1-1)
            biocminor=$(echo "$biocversion" | cut -c 3-4)
            bioccont=$(echo "bioconductor/bioconductor_docker:RELEASE_${biocmajor}_${biocminor}")
          fi

          echo "Found these settings:"
          echo "Bioconductor version: $biocversion, R version: $rversion, Bioconductor docker name: $bioccont"
          echo "matrix={ \"config\": [{\"os\" : \"ubuntu-latest\", \"r\" : \"${rversion}\", \"bioc\" : \"${biocversion}\", \"cont\" : \"${bioccont}\"} , {\"os\" : \"macOS-latest\", \"r\" : \"${rversion}\", \"bioc\" : \"${biocversion}\"} , {\"os\" : \"windows-latest\", \"r\" : \"${rversion}\", \"bioc\" : \"${biocversion}\" }] }" >> "$GITHUB_OUTPUT"
          # Emit explicit linux-specific outputs so other jobs can reference them directly
          echo "linux_cont=${bioccont}" >> "$GITHUB_OUTPUT"
          echo "linux_r=${rversion}" >> "$GITHUB_OUTPUT"
          echo "linux_bioc=${biocversion}" >> "$GITHUB_OUTPUT"
          echo "linux_os=ubuntu-latest" >> "$GITHUB_OUTPUT"
          ## If an OS is failing and you don't want to test it, manually remove it from the 'matrix' JSON entries above

  build-check:
    needs: bioc-config
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.bioc-config.outputs.matrix)}}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      NOT_CRAN: true
      TZ: UTC
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      ## Most of these steps are the same as the ones in
      ## https://github.com/r-lib/actions/blob/master/examples/check-standard.yaml
      ## If they update their steps, we will also need to update ours.
      - name: Checkout Repository
        uses: actions/checkout@v3

      ## R is already included in the Bioconductor docker images
      - name: Setup R from r-lib
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      ## pandoc is already included in the Bioconductor docker images
      - name: Setup pandoc from r-lib
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-pandoc@v2

      ## Create the path that will be used for caching packages on Linux
      - name: Create R_LIBS_USER on Linux
        if: runner.os == 'Linux'
        run: |
          R_LIBS_USER=/__w/_temp/Library
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          mkdir -p $R_LIBS_USER

      ## Use cached R packages
      - name: Restore R package cache
        if: "!contains(github.event.head_commit.message, '/nocache')"
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ matrix.config.os }}-${{ matrix.config.r }}-${{ matrix.config.bioc }}-${{ inputs.cache-version }}
          restore-keys: ${{ matrix.config.os }}-${{ matrix.config.r }}-${{ matrix.config.bioc }}-${{ inputs.cache-version }}

      ## remotes is needed for installing the Linux system dependencies
      ## as well as other R packages later on.
      - name: Install remotes
        run: |
          message(paste('****', Sys.time(), 'installing remotes ****'))
          install.packages('remotes')
        shell: Rscript {0}

      ## This will work again once https://github.com/r-lib/remotes/commit/0e4e23051041d9f1b15a5ab796defec31af6190d
      ## makes it to the CRAN version of remotes

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install hdf5-tools
        shell: bash

      - name: Install macOS system dependencies
        if: matrix.config.os == 'macOS-latest'
        run: |
          ## Enable installing XML from source if needed
          brew install libxml2
          echo "XML_CONFIG=/usr/local/opt/libxml2/bin/xml2-config" >> $GITHUB_ENV

          ## Required to install magick as noted at
          ## https://github.com/r-lib/usethis/commit/f1f1e0d10c1ebc75fd4c18fa7e2de4551fd9978f#diff-9bfee71065492f63457918efcd912cf2
          brew install imagemagick@6

          ## For textshaping, required by ragg, and required by pkgdown
          brew install harfbuzz fribidi

          ## For installing usethis's dependency gert
          brew install libgit2

          ## Required for tcltk
          brew install xquartz --cask

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: |
          ## Edit below if you have any Windows system dependencies
        shell: Rscript {0}

      - name: Install BiocManager
        run: |
          message(paste('****', Sys.time(), 'installing BiocManager ****'))
          remotes::install_cran("BiocManager")
        shell: Rscript {0}

      - name: Set BiocVersion
        run: |
          BiocManager::install(version = "${{ matrix.config.bioc }}", ask = FALSE, force = TRUE)
        shell: Rscript {0}

      - name: Install dependencies pass 1
        run: |
          ## Try installing the package dependencies in steps. First the local
          ## dependencies, then any remaining dependencies to avoid the
          ## issues described at
          ## https://stat.ethz.ch/pipermail/bioc-devel/2020-April/016675.html
          ## https://github.com/r-lib/remotes/issues/296
          ## Ideally, all dependencies should get installed in the first pass.

          ## For running the checks
          message(paste('****', Sys.time(), 'installing rcmdcheck and BiocCheck ****'))
          install.packages(c("rcmdcheck", "BiocCheck"), repos = BiocManager::repositories())

          ## Pass #1 at installing dependencies
          message(paste('****', Sys.time(), 'pass number 1 at installing dependencies: local dependencies ****'))
          remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = FALSE, upgrade = TRUE)
        continue-on-error: true
        shell: Rscript {0}

      - name: Install dependencies pass 2
        run: |
          ## Pass #2 at installing dependencies
          message(paste('****', Sys.time(), 'pass number 2 at installing dependencies: any remaining dependencies ****'))
          remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = TRUE, upgrade = TRUE, force = TRUE)
        shell: Rscript {0}

      - name: Install covr
        if: env.run_covr == 'true' && runner.os == 'Linux'
        run: |
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Install pkgdown
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: |
          remotes::install_github("r-lib/pkgdown")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Run CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: false
          DISPLAY: 99.0
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--no-vignettes", "--timings"),
              build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
              error_on = "warning",
              check_dir = "check"
          )
        shell: Rscript {0}

      - name: Reveal testthat details
        run: find . -name testthat.Rout -exec cat '{}' ';'

      - name: Run BiocCheck
        env:
          DISPLAY: 99.0
        run: |
          if (requireNamespace("BiocCheck", quietly = TRUE)) {
            BiocCheck::BiocCheck(
              dir('check', 'tar.gz$', full.names = TRUE),
              `quit-with-status` = TRUE,
              `no-check-R-ver` = TRUE,
              `no-check-bioc-help` = TRUE
            )
          }
        shell: Rscript {0}

      - name: Install package
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: R CMD INSTALL .

      - name: Build pkgdown site
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Install deploy dependencies
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: |
          apt-get update && apt-get -y install rsync

      - name: Deploy pkgdown site to GitHub pages 🚀
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          clean: false
          branch: gh-pages
          folder: docs

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@master
        with:
          name: ${{ runner.os }}-${{ matrix.config.r }}-${{ matrix.config.bioc }}-results
          path: check

  coverage:
    needs: bioc-config
    name: Coverage (single matrix entry)
    runs-on: ${{ needs.bioc-config.outputs.linux_os }}
    container: ${{ needs.bioc-config.outputs.linux_cont }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      NOT_CRAN: true
      TZ: UTC
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create R_LIBS_USER on Linux
        if: runner.os == 'Linux'
        run: |
          R_LIBS_USER=/__w/_temp/Library
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          mkdir -p $R_LIBS_USER
        shell: bash

      - name: Install remotes
        run: |
          message(paste('****', Sys.time(), 'installing remotes ****'))
          install.packages('remotes')
        shell: Rscript {0}

      - name: Install BiocManager
        run: |
          message(paste('****', Sys.time(), 'installing BiocManager ****'))
          remotes::install_cran("BiocManager")
        shell: Rscript {0}

      - name: Set BiocVersion
        run: |
          BiocManager::install(version = "${{ needs.bioc-config.outputs.linux_bioc }}", ask = FALSE, force = TRUE)
        shell: Rscript {0}

      - name: Restore R package cache (coverage)
        if: "!contains(github.event.head_commit.message, '/nocache')"
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ needs.bioc-config.outputs.linux_os }}-${{ needs.bioc-config.outputs.linux_r }}-${{ needs.bioc-config.outputs.linux_bioc }}-${{ inputs.cache-version }}
          restore-keys: ${{ needs.bioc-config.outputs.linux_os }}-${{ needs.bioc-config.outputs.linux_r }}-${{ needs.bioc-config.outputs.linux_bioc }}-${{ inputs.cache-version }}

      - name: Install dependencies pass 1 (coverage)
        run: |
          message(paste('****', Sys.time(), 'installing rcmdcheck and BiocCheck (coverage) ****'))
          install.packages(c("rcmdcheck", "BiocCheck"), repos = BiocManager::repositories())
          remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = FALSE, upgrade = TRUE)
        continue-on-error: true
        shell: Rscript {0}

      - name: Install dependencies pass 2 (coverage)
        run: |
          message(paste('****', Sys.time(), 'pass number 2 at installing dependencies (coverage) ****'))
          remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = TRUE, upgrade = TRUE, force = TRUE)
        shell: Rscript {0}

      - name: Install covr
        run: |
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
  push:
    branches:
      - devel
      - 'RELEASE_**'
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  ## Measure coverage against the Bioconductor version the branch targets,
  ## the same way R-CMD-check-bioc does. A `RELEASE_x_y` branch checked
  ## against devel fails on packages that changed behaviour after the branch
  ## was cut.
  bioc-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Resolve the Bioconductor version to check against
        id: resolve
        shell: bash
        env:
          REF: ${{ github.base_ref || github.ref_name }}
        run: |
          ref="$REF"
          case "$ref" in
            RELEASE_*) version="${ref#RELEASE_}"; version="${version//_/.}" ;;
            *)         version="devel" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Measuring coverage of '$ref' against Bioconductor $version"

  test-coverage:
    needs: bioc-version

    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install hdf5-tools libsz2 libaec-dev

      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: ${{ needs.bioc-version.outputs.version }}

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

name: R-CMD-check-bioc

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

jobs:
  R-CMD-check-bioc:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.bioc-version }})

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-latest, bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/',  Ncpus: 2}
        - { os: macOS-latest,   bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/',  Ncpus: 3}
        - { os: macOS-15-intel, bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/',  Ncpus: 3}
        - { os: ubuntu-latest,  bioc-version: 'devel', bioc-mirror: 'https://bioconductor.posit.co/',  Ncpus: 4}
        - { os: ubuntu-latest,  bioc-version: 'release',  bioc-mirror: 'https://packagemanager.posit.co/bioconductor',  Ncpus: 4}
    steps:

      ## R CMD check complains about Windows line endings without this
      - name: Configure git
        run: |
          git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install hdf5-tools

      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: ${{ matrix.config.bioc-version }}
          bioc-mirror: ${{ matrix.config.bioc-mirror }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Bioc - Build, Install, Check
        uses: grimbough/bioc-actions/build-install-check@v1

      - name: Discover package check directory
        id: discover-check-dir
        run: |
          # Try common locations where r-lib/actions/check-r-package writes results
          # 1) $RUNNER_TEMP/package
          # 2) *_check (pattern in repo root)
          set -euo pipefail
          echo "Looking for package check directories..."
          candidates=()
          if [ -d "${{ runner.temp }}/package" ]; then
            candidates+=("${{ runner.temp }}/package")
          fi
          # Search for directories ending with .Rcheck in repo (R CMD check output)
          while IFS= read -r -d $'\0' d; do
            candidates+=("$d")
          done < <(find . -maxdepth 3 -type d -name '*.Rcheck' -print0 || true)

          # If no candidates found, fallback to runner temp
          if [ ${#candidates[@]} -eq 0 ]; then
            echo "No explicit package check dir found, using runner temp: ${{ runner.temp }}"
            CHECK_DIR="${{ runner.temp }}"
          else
            CHECK_DIR="${candidates[0]}"
          fi

          echo "::set-output name=check-dir::$CHECK_DIR"
        shell: bash

      - name: Show testthat output
        run: |
          ## --------------------------------------------------------------------
          echo ::group::Show testthat output
          CHECK_DIR="${{ steps.discover-check-dir.outputs.check-dir }}"
          echo "Using check dir: $CHECK_DIR"
          find "$CHECK_DIR" -name 'testthat.Rout*' -exec cat '{}' \; || true
          echo ::endgroup::
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('{0}-{1}-r{2}-{3}-results', runner.os, runner.arch, matrix.config.bioc-version, matrix.config.id ) }}
          path: ${{ steps.discover-check-dir.outputs.check-dir }}

      - name: Run BiocCheck
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.bioc-version == 'devel'
        uses: grimbough/bioc-actions/run-BiocCheck@v1
        with:
          error-on: 'never'
          arguments: '--no-check-bioc-help'

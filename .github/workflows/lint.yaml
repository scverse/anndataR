# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [devel]
  pull_request:

name: lint

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: devel

      ## Resolve versions that haven't reached the Bioconductor repositories yet,
      ## see R-CMD-check-bioc.yaml
      - name: Add the Bioconductor R-universe
        run: |
          repos <- c(
            BiocManager::repositories(),
            bioc_runiverse = "https://bioc.r-universe.dev"
          )
          write(
            sprintf("options(repos = %s)", deparse1(repos)),
            file = "~/.Rprofile",
            append = TRUE
          )
        shell: Rscript {0}

      - name: Install air
        run: curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | sh

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler, local::.
          needs: lint
          cache-version: 2

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Check code style
        run: air format --check .

      - name: Check vignette style
        run: styler::style_dir("vignettes", dry = "fail")
        shell: Rscript {0}

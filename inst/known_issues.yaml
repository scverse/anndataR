known_issues:
  - backend: to_SCE
    slot:
      - obsm
      - varm
    dtype:
      - pca
    process: [convert]
    error_message:
      sampleFactors(reducedDims(sce)$pca) (`actual`) not equal to ad$obsm[["X_pca"]] (`expected`).

        `dimnames(actual)` is a list
        `dimnames(expected)` is absent
    description: converted sce object has dimnames(), whilst the original anndata does not.
    proposed_solution: Investigate if this is a problem or not.
    to_investigate: True
    to_fix: False
  - backend:
      - HDF5AnnData
      - ZarrAnnData
    slot:
      - uns
    dtype:
      - no_encoding
    process: [read]
    error_message: |-
      Skipping element uns/nested/citation
      Caused by error in `read_h5ad_element()`:
      ! Error reading element uns/nested/citation
      Caused by error in `read_h5ad_encoding()`:
      ! Element "uns/nested/citation" in 'file.h5ad' has no encoding-type attribute
      ℹ Reading elements without encoding metadata is not supported yet, see <https://github.com/scverse/anndataR/issues/134>
      ℹ Add encoding metadata to this element, or remove it from the file
    description: An element without encoding metadata, e.g. `uns/citation` in some CELLxGENE files, is skipped with a warning, while Python anndata reads it with an `OldFormatWarning` (issues #134, #583).
    proposed_solution: Guess the encoding from the kind of node, as Python anndata does, as part of reading files from older anndata versions (issue #134).
    to_investigate: False
    to_fix: True
